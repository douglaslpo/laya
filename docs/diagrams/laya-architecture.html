<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laya · Arquitetura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f5f1;
      --color-ink:     #221814;
      --color-muted:   #524842;
      --color-accent:  #c7683a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitetura · Laya</p>
    <h1>Laya: do evento à ação confirmada</h1>

    <div class="scroll">
    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="laya-architecture-title laya-architecture-desc">
      <title id="laya-architecture-title">Laya: do evento à ação confirmada</title>
      <desc id="laya-architecture-desc">Plataformas externas enviam eventos via n8n ao engine local do Laya, que classifica com um provedor de LLM, guarda em SQLite e ChromaDB, mostra Action Cards na interface e só executa ações depois da confirmação humana.</desc>

        <pattern id="laya-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(34,24,20,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#524842"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c7683a"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f5f1"/>
      <rect width="100%" height="100%" fill="url(#laya-dots)" opacity="0.55"/>

      <!-- Zone: local machine -->
      <rect x="256" y="64" width="432" height="400" rx="8"
            fill="rgba(34,24,20,0.02)" stroke="rgba(34,24,20,0.10)" stroke-width="0.8"/>
      <rect x="408" y="68" width="128" height="12" rx="2" fill="#f7f5f1"/>
      <text x="472" y="77" fill="rgba(34,24,20,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">SUA MÁQUINA · 127.0.0.1</text>

      <!-- Arrows first (behind boxes) -->
      <!-- Ingest: platforms -> n8n -> engine -->
      <line x1="184" y1="264" x2="272" y2="264" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="408" y1="264" x2="504" y2="264" stroke="#524842" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Egress return: engine -> n8n -> platforms -->
      <line x1="504" y1="288" x2="408" y2="288" stroke="#524842" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="272" y1="288" x2="184" y2="288" stroke="#524842" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Engine <-> interface -->
      <line x1="546" y1="240" x2="546" y2="160" stroke="#524842" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="588" y1="160" x2="588" y2="240" stroke="#c7683a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- MCP client -> engine top -->

            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Engine -> LLM provider -->
      <line x1="672" y1="256" x2="760" y2="256" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Engine -> agents CLI -->
      <path d="M 672,288 H 708 Q 716,288 716,296 V 408 Q 716,416 724,416 H 760"
            fill="none" stroke="#524842" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Engine -> storage -->
      <line x1="588" y1="304" x2="588" y2="384" stroke="#524842" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->

      <text x="228" y="254" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENTOS</text>

      <rect x="418" y="244" width="76" height="12" rx="2" fill="#f7f5f1"/>
      <text x="456" y="254" fill="#524842" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /EVENTS</text>

      <rect x="428" y="296" width="56" height="12" rx="2" fill="#f7f5f1"/>
      <text x="456" y="305" fill="#524842" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXECUTOR</text>

      <rect x="212" y="296" width="32" height="12" rx="2" fill="#f7f5f1"/>
      <text x="228" y="305" fill="#524842" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AÇÃO</text>

      <rect x="472" y="194" width="64" height="12" rx="2" fill="#f7f5f1"/>
      <text x="504" y="203" fill="#524842" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CARDS · WS</text>

      <rect x="598" y="172" width="56" height="12" rx="2" fill="#f7f5f1"/>
      <text x="626" y="181" fill="#c7683a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONFIRMA</text>

      <rect x="810" y="170" width="60" height="12" rx="2" fill="#f7f5f1"/>

      <text x="630" y="347" fill="#524842" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL · FTS5</text>

      <rect x="40" y="240" width="144" height="64" rx="6" fill="rgba(34,24,20,0.03)" stroke="rgba(34,24,20,0.30)" stroke-width="1"/>
      <rect x="48" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(34,24,20,0.22)" stroke-width="0.8"/>

      <rect x="272" y="240" width="136" height="64" rx="6" fill="#f7f5f1"/>

      <text x="296" y="257" fill="#221814" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FLOW</text>

      <text x="340" y="292" fill="#524842" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:45678 · workflows</text>

      <!-- Node: Engine (focal) -->
      <rect x="504" y="240" width="168" height="64" rx="6" fill="#f7f5f1"/>
      <rect x="504" y="240" width="168" height="64" rx="6" fill="rgba(199,104,58,0.08)" stroke="#c7683a" stroke-width="1"/>

      <text x="528" y="257" fill="#c7683a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="588" y="276" fill="#221814" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Engine Laya</text>
      <text x="588" y="292" fill="#524842" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI :8420 · personas</text>

      <!-- Node: Interface (input) -->
      <rect x="504" y="96" width="168" height="64" rx="6" fill="#f7f5f1"/>
      <rect x="504" y="96" width="168" height="64" rx="6" fill="rgba(82,72,66,0.10)" stroke="#6d645e" stroke-width="1"/>
      <rect x="512" y="104" width="20" height="12" rx="2" fill="transparent" stroke="rgba(109,100,94,0.40)" stroke-width="0.8"/>
      <text x="522" y="113" fill="#6d645e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="588" y="132" fill="#221814" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Interface</text>
      <text x="588" y="148" fill="#524842" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tauri + SvelteKit</text>

      <!-- Node: MCP client (external) -->
      <rect x="760" y="96" width="176" height="64" rx="6" fill="#f7f5f1"/>

      <rect x="768" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(34,24,20,0.22)" stroke-width="0.8"/>

      <!-- Node: LLM provider (external) -->
      <rect x="760" y="240" width="176" height="64" rx="6" fill="#f7f5f1"/>

      <text x="848" y="292" fill="#524842" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ollama · LiteLLM · BYOK</text>

      <!-- Node: Agents CLI (backend) -->
      <rect x="760" y="384" width="176" height="64" rx="6" fill="#f7f5f1"/>

      <text x="782" y="401" fill="#221814" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>

      <text x="848" y="436" fill="#524842" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude Code · Codex · Pi</text>

      <!-- Node: Storage (store) -->
      <rect x="504" y="384" width="168" height="64" rx="6" fill="#f7f5f1"/>

      <text x="588" y="420" fill="#221814" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite + ChromaDB</text>
      <text x="588" y="436" fill="#524842" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FTS5 · vetores</text>

      <!-- Legend strip -->
      <line x1="40" y1="480" x2="960" y2="480" stroke="rgba(34,24,20,0.10)" stroke-width="0.8"/>
      <text x="40" y="496" fill="#524842" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGENDA</text>

      <rect x="40" y="512" width="14" height="10" rx="2" fill="rgba(199,104,58,0.08)" stroke="#c7683a" stroke-width="1"/>

      <rect x="152" y="512" width="14" height="10" rx="2" fill="#ffffff" stroke="#221814" stroke-width="1"/>

      <rect x="264" y="512" width="14" height="10" rx="2" fill="rgba(34,24,20,0.05)" stroke="#524842" stroke-width="1"/>

  </div>
</body>
